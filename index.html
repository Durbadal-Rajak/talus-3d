  buildResultScene();
}

function surfZ(Sf, x, y) {
  const dx = Math.cos(Sf.theta), dy = Math.sin(Sf.theta);
  const u = (x - Sf.C[0]) * dx + (y - Sf.C[1]) * dy, v = -(x - Sf.C[0]) * dy + (y - Sf.C[1]) * dx;
  const Q = 1 - (u / Sf.R) ** 2 - (Sf.cyl || !isFinite(Sf.a) ? 0 : (v / Sf.a) ** 2);
  return Q > 0 ? Sf.C[2] - (Sf.Rw || Sf.R) * Math.sqrt(Q) : Infinity;
}

function buildResultScene() {
  if (!renderer) return;
  clearGroup(resultGroup);
  const ovF = $('ovFs'), ovL = $('ovLegend');
  const r = result && view.method && result.results[view.method];
  if (!r || !M) { ovF.hidden = true; ovL.hidden = true; applyXray(); return; }
  const O = origin, Sf = r.surface;
  // slip surface tiles
  const key = view.colorBy;
  const vals = r.columns.map(c => key === 'mat' ? c.mat : c[key]);
  let lo = Infinity, hi = -Infinity; for (const v of vals) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (!(hi > lo)) hi = lo + 1;
  const dx = Math.cos(Sf.theta), dy = Math.sin(Sf.theta), hu = r.du / 2, hv = r.dv / 2;
  const pos = [], col = [];
  r.columns.forEach((c, i) => {
    const color = key === 'mat' ? matColor(c.mat) : rampColor((vals[i] - lo) / (hi - lo));
    const corners = [[-hu, -hv], [hu, -hv], [hu, hv], [-hu, hv]].map(([a, b]) => {
      const x = c.x + a * dx - b * dy, y = c.y + a * dy + b * dx;
      let z = surfZ(Sf, x, y); if (!isFinite(z)) z = c.zb; z = Math.min(z, M.G(x, y));
      return [x - O[0], y - O[1], z - O[2]];
    });
    for (const q of [corners[0], corners[1], corners[2], corners[0], corners[2], corners[3]]) { pos.push(...q); col.push(color.r, color.g, color.b); }
  });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  resultGroup.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));
  // sliding direction arrow
  let cx = 0, cy = 0, cz = 0, wsum = 0;
  for (const c of r.columns) { cx += c.x * c.weight; cy += c.y * c.weight; cz += c.zt * c.weight; wsum += c.weight; }
  cx /= wsum; cy /= wsum; cz /= wsum;
  const len = Math.max(r.du * 8, Sf.R * 0.6);
  const arrow = new THREE.ArrowHelper(new THREE.Vector3(Math.cos(r.alpha), Math.sin(r.alpha), 0), new THREE.Vector3(cx - O[0] - Math.cos(r.alpha) * len / 2, cy - O[1] - Math.sin(r.alpha) * len / 2, cz - O[2] + len * 0.25), len, new THREE.Color(css('--accent')).getHex(), len * 0.25, len * 0.14);
  resultGroup.add(arrow);
  // trial surfaces as ground outlines
  if (view.showTop && result.top && Sf && !Sf.cyl) {
    const Fs = result.top.map(t => t.F), f0 = Math.min(...Fs), f1 = Math.max(...Fs);
    for (const t of result.top) {
      const T = t.surface; if (!T || T.cyl) continue;
      const pts = [];
      const tdx = Math.cos(T.theta), tdy = Math.sin(T.theta);
      for (let k = 0; k <= 72; k++) {
        const ph = k / 72 * 2 * Math.PI, cu = Math.cos(ph) * T.R, cv = Math.sin(ph) * T.a;
        let a = 0, b = 1, found = false;
        const at = rr => { const x = T.C[0] + rr * cu * tdx - rr * cv * tdy, y = T.C[1] + rr * cu * tdy + rr * cv * tdx; return [x, y, surfZ(T, x, y) - M.G(x, y)]; };
        if (at(0)[2] < 0) { for (let it = 0; it < 22; it++) { const m = (a + b) / 2; if (at(m)[2] < 0) a = m; else b = m; } found = true; }
        if (!found) continue;
        const [x, y] = at(a); pts.push(new THREE.Vector3(x - O[0], y - O[1], M.G(x, y) - O[2] + 0.05));
      }
      if (pts.length < 3) continue;
      const lg = new THREE.BufferGeometry().setFromPoints(pts);
      const c = rampColor(1 - (t.F - f0) / Math.max(1e-9, f1 - f0));
      resultGroup.add(new THREE.Line(lg, new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.7 })));
    }
  }
  // overlays
  const [cl, lab] = fsClass(r.F);
  ovF.hidden = false;
  ovF.innerHTML = `<span class="m">${METHOD_NAME[view.method]} 3D · ${result.cfg.type}</span><span class="v">FS ${fmt(r.F, 3)}</span><span class="pill ${cl}">${lab}</span>${stale ? '<span class="m" style="color:var(--warn)">out of date</span>' : ''}`;
  if (key === 'mat') {
    ovL.hidden = false;
    const used = [...new Set(r.columns.map(c => c.mat))];
    ovL.innerHTML = `<div class="t">Base material</div>` + used.map(i => `<div class="row" style="gap:6px;font-size:12px"><span style="width:12px;height:12px;border-radius:2px;background:${esc(project.materials[i] ? project.materials[i].color : '#999')}"></span>${esc(project.materials[i] ? project.materials[i].name : i)}</div>`).join('');
  } else {
    ovL.hidden = false;
    ovL.innerHTML = `<div class="t">${DATA[key][0]}${DATA[key][1] ? ' · ' + DATA[key][1] : ''}</div><div class="ramp" style="background:linear-gradient(90deg,${RAMP.join(',')})"></div><div class="ends"><span>${fmt(lo, key === 'malpha' ? 2 : 0)}</span><span>${fmt(hi, key === 'malpha' ? 2 : 0)}</span></div>`;
  }
  applyXray();
}
function applyXray() {
  if (!groundMat) return;
  const on = !!(result && view.xray && tab === 'results');
  groundMat.opacity = on ? 0.42 : 1; groundMat.depthWrite = !on; groundMat.needsUpdate = true;
}

/* ------------------------------------------------------------- 2D section */
function drawSection() {
  const cv = $('sectionCv'); if (!cv || !result || !M) return;
  const r = result.results[view.method]; if (!r) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const Sf = r.surface, e = MODEL.extent;
  const dx = Math.cos(Sf.theta), dy = Math.sin(Sf.theta);
  // section line through C, clipped to the extent
  let s0 = -Infinity, s1 = Infinity;
  for (const [p, d, a, b] of [[Sf.C[0], dx, e.x0, e.x1], [Sf.C[1], dy, e.y0, e.y1]]) {
    if (Math.abs(d) < 1e-9) continue;
    const t1 = (a - p) / d, t2 = (b - p) / d; s0 = Math.max(s0, Math.min(t1, t2)); s1 = Math.min(s1, Math.max(t1, t2));
  }
  if (!(s1 > s0)) return;
  const n = 300, ss = [], prof = [];
  for (let i = 0; i <= n; i++) {
    const s = s0 + (s1 - s0) * i / n, x = Sf.C[0] + s * dx, y = Sf.C[1] + s * dy;
    ss.push(s); prof.push({ x, y, g: M.G(x, y), L: M.layers.map(L => L.at(x, y)), w: M.W ? M.W(x, y) : null, z: surfZ(Sf, x, y) });
  }
  let zt = -Infinity, zb = zmin; for (const p of prof) zt = Math.max(zt, p.g, p.w == null ? -Infinity : p.w);
  // equal scales
  const pad = { l: 46, r: 12, t: 12, b: 26 };
  const sx = (W - pad.l - pad.r) / (s1 - s0), sz = (H - pad.t - pad.b) / (zt - zb), k = Math.min(sx, sz);
  const ox = pad.l + ((W - pad.l - pad.r) - k * (s1 - s0)) / 2, oz = H - pad.b;
  const X = s => ox + (s - s0) * k, Z = z => oz - (z - zb) * k;
  // zones
  for (let zi = M.layers.length; zi >= 0; zi--) {
    ctx.beginPath();
    prof.forEach((p, i) => { const top = zi === 0 ? p.g : Math.min(p.g, p.L[zi - 1]); i ? ctx.lineTo(X(ss[i]), Z(top)) : ctx.moveTo(X(ss[i]), Z(top)); });
    ctx.lineTo(X(s1), Z(zb)); ctx.lineTo(X(s0), Z(zb)); ctx.closePath();
    ctx.fillStyle = (project.materials[M.zonesMat[zi]] || {}).color || '#999'; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
  }
  // ground line
  ctx.beginPath(); prof.forEach((p, i) => i ? ctx.lineTo(X(ss[i]), Z(p.g)) : ctx.moveTo(X(ss[i]), Z(p.g)));
  ctx.strokeStyle = css('--ink'); ctx.lineWidth = 1.4; ctx.stroke();
  // water
  if (M.W) { ctx.beginPath(); prof.forEach((p, i) => i ? ctx.lineTo(X(ss[i]), Z(p.w)) : ctx.moveTo(X(ss[i]), Z(p.w))); ctx.setLineDash([6, 4]); ctx.strokeStyle = css('--water'); ctx.lineWidth = 1.4; ctx.stroke(); ctx.setLineDash([]); }
  // slip surface and mass
  ctx.beginPath(); let open = false;
  prof.forEach((p, i) => { if (p.z < p.g) { open ? ctx.lineTo(X(ss[i]), Z(p.z)) : ctx.moveTo(X(ss[i]), Z(p.z)); open = true; } });
  ctx.strokeStyle = css('--accent'); ctx.lineWidth = 2.4; ctx.stroke();
  // axes
  ctx.fillStyle = css('--muted'); ctx.strokeStyle = css('--line'); ctx.lineWidth = 1; ctx.font = '11px ' + css('--f-data');
  const step = niceStep((zt - zb) / 4);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let z = Math.ceil(zb / step) * step; z <= zt; z += step) { ctx.beginPath(); ctx.moveTo(ox - 4, Z(z)); ctx.lineTo(ox, Z(z)); ctx.stroke(); ctx.fillText(fmt(z, 0), ox - 6, Z(z)); }
  const hs = niceStep((s1 - s0) / 5);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let s = Math.ceil(s0 / hs) * hs; s <= s1; s += hs) { ctx.beginPath(); ctx.moveTo(X(s), oz); ctx.lineTo(X(s), oz + 4); ctx.stroke(); ctx.fillText(fmt(s, 0), X(s), oz + 6); }
  ctx.textAlign = 'left'; ctx.fillText(`distance along ${fmt(azFromAlpha(Sf.theta), 0)}° from slip centre, m`, ox, 2);
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; }
window.addEventListener('resize', () => { if (tab === 'results') drawSection(); });

/* ------------------------------------------------------------- boot */
if (!project.gridN) project.gridN = 150;
renderTabs(); renderPanel();
if (initGL()) { updateScene(); compute(); }
})();
